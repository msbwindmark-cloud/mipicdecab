{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-home"></i> Gestión de Residencias/Pupilaje</h1>
    <a href="{% url 'residencia_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Residencia</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, propietario, tipo..." value="{{ query }}"
               hx-get="{% url 'residencia_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-residencias" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-residencias">
        {% include 'residencias/_lista.html' %}
    </div>
</div>
{% endblock %}
