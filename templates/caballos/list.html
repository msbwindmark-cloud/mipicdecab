{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-horse"></i> Gestión de Caballos</h1>
    <div>
        <a href="{% url 'exportar_caballos_excel' %}" class="btn btn-success"><i class="fas fa-file-excel"></i> Exportar Excel</a>
        <a href="{% url 'caballo_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Caballo</a>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" 
               class="form-control" 
               name="q" 
               placeholder="Buscar por nombre, microchip, propietario..." 
               value="{{ query }}"
               hx-get="{% url 'caballo_list' %}" 
               hx-trigger="keyup changed delay:300ms" 
               hx-target="#lista-caballos"
               hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-caballos">
        {% include 'caballos/_lista.html' %}
    </div>
</div>
{% endblock %}
