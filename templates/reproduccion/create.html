{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-pink text-white" style="background:#d63384;">
                <h3 class="mb-0"><i class="fas fa-venus-mars"></i> Nueva Cubrición</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Yegua</label>
                            <select name="yegua" class="form-select" required>
                                {% for c in caballos %}
                                <option value="{{ c.pk }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Semental (opcional)</label>
                            <select name="semental" class="form-select">
                                <option value="">Ninguno</option>
                                {% for c in caballos %}
                                <option value="{{ c.pk }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select">
                                <option value="MONTA_NATURAL">Monta Natural</option>
                                <option value="INSEMINACION">Inseminación Artificial</option>
                                <option value="TRANSFERENCIA">Transferencia Embrionaria</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha Cubrición</label>
                            <input type="date" name="fecha_cubricion" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Parto Estimado</label>
                            <input type="date" name="fecha_parto_estimada" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Veterinario</label>
                            <input type="text" name="veterinario" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Coste (€)</label>
                            <input type="number" name="coste" class="form-control" step="0.01" value="0">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Registrar</button>
                        <a href="{% url 'reproduccion_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
