{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-clock"></i> Fichar</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Empleado</label>
                        <select name="empleado" class="form-select" required>
                            {% for e in empleados %}
                            <option value="{{ e.pk }}">{{ e.nombre }} {{ e.apellidos }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select">
                            <option value="ENTRADA">Entrada</option>
                            <option value="SALIDA">Salida</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notas</label>
                        <input type="text" name="notas" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100"><i class="fas fa-check"></i> Registrar Fichaje</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
