{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-user-tie"></i> Empleados</h1>
    <a href="{% url 'fichar' %}" class="btn btn-primary"><i class="fas fa-clock"></i> Fichar</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por nombre, puesto, teléfono..." value="{{ query }}"
               hx-get="{% url 'empleado_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-empleados" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-empleados">
        {% include 'empleados/_lista.html' %}
    </div>
</div>
{% endblock %}
