{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-stream"></i> Timeline Unificado - {{ caballo.nombre }}</h1>
    <a href="{% url 'caballo_detail' caballo.pk %}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver a ficha</a>
</div>
<div class="card">
    <div class="card-body">
        {% for e in eventos %}
        <div class="d-flex mb-4">
            <div class="me-3"><span class="badge bg-{{ e.color }} p-2"><i class="fas {{ e.icono }}"></i></span></div>
            <div>
                <h6 class="mb-1">{{ e.titulo }} <small class="text-muted">{{ e.fecha }}</small></h6>
                <p class="mb-0">{{ e.detalle }}</p>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-muted">Sin eventos registrados</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
