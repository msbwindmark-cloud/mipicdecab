{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-tint"></i> Control de Consumos</h1>
    <a href="{% url 'consumo_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Registrar Consumo</a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <h5 class="text-center">Total Coste: <span class="text-danger fw-bold">{{ total }} €</span></h5>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por tipo, proveedor, notas..." value="{{ query }}"
               hx-get="{% url 'consumo_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-consumos" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-consumos">
        {% include 'consumos/_lista.html' %}
    </div>
</div>
{% endblock %}
