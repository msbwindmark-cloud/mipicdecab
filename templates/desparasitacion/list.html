{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-bug"></i> Control de Desparasitación</h1>
    <a href="{% url 'registrar_desparasitacion' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Registrar</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, producto, tipo..." value="{{ query }}"
               hx-get="{% url 'desparasitacion_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-desparasitacion" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-desparasitacion">
        {% include 'desparasitacion/_lista.html' %}
    </div>
</div>
{% endblock %}
