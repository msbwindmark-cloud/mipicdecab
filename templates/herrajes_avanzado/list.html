{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-hammer"></i> Control Avanzado de Herrajes</h1>
    <a href="{% url 'herraje_programar' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Programar Visita</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, herrador, tipo..." value="{{ query }}"
               hx-get="{% url 'herraje_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-herrajes-avanzado" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-herrajes-avanzado">
        {% include 'herrajes_avanzado/_lista.html' %}
    </div>
</div>
{% endblock %}
