{% extends 'base.html' %}
{% block content %}
<h1><i class="fas fa-comments"></i> Chat Flotante - Panel</h1>
<div class="card mt-4">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark"><tr><th>Propietario</th><th>Actualizado</th><th>Acciones</th></tr></thead>
            <tbody>
                {% for c in conversaciones %}
                <tr>
                    <td>{{ c.propietario }}</td>
                    <td>{{ c.actualizado }}</td>
                    <td><a href="{% url 'chat_conversacion' c.pk %}" class="btn btn-sm btn-primary">Ver conversación</a></td>
                </tr>
                {% empty %}
                <tr><td colspan="3" class="text-center">Sin conversaciones</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
