{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-shield-alt"></i> Seguros</h1>
    <a href="{% url 'seguro_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Seguro</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, compañía, póliza..." value="{{ query }}"
               hx-get="{% url 'seguro_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-seguros" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-seguros">
        {% include 'seguros/_lista.html' %}
    </div>
</div>
{% endblock %}
