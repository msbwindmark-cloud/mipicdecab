{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0"><i class="fas fa-broom"></i> Registrar Limpieza</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Box</label>
                        <select name="box" class="form-select" required>
                            {% for b in boxes %}
                            <option value="{{ b.pk }}">Box {{ b.numero }} ({{ b.bloque|default:"General" }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select">
                            <option value="DIARIA">Limpieza Diaria</option>
                            <option value="PROFUNDA">Limpieza Profunda</option>
                            <option value="DESINFECCION">Desinfección</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Realizada por</label>
                        <input type="text" name="realizada_por" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notas</label>
                        <textarea name="notas" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100"><i class="fas fa-save"></i> Registrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
