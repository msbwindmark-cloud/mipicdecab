{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-eye"></i> {{ title|default:"Detalle" }}</h1>
    <div>
        <a href="{{ edit_url }}" class="btn btn-warning"><i class="fas fa-edit"></i> Editar</a>
        <a href="{{ delete_url }}" class="btn btn-danger"><i class="fas fa-trash"></i> Eliminar</a>
        <a href="{{ list_url }}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Volver</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-borderless">
            <tbody>
                {% for field in fields %}
                <tr>
                    <th style="width: 200px;">{{ field.label }}</th>
                    <td>{{ field.value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
