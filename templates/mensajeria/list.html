{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-comments"></i> Mensajería Interna</h1>
    <a href="{% url 'enviar_mensaje' %}" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Nuevo Mensaje</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por contenido..." value="{{ query }}"
               hx-get="{% url 'mensajeria_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-mensajeria" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-mensajeria">
        {% include 'mensajeria/_lista.html' %}
    </div>
</div>
{% endblock %}
