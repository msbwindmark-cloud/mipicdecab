{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-tools"></i> Mantenimiento de Instalaciones</h1>
    <a href="{% url 'mantenimiento_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Mantenimiento</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por descripción, tipo, realizado por, box..." value="{{ query }}"
               hx-get="{% url 'mantenimiento_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-mantenimiento" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-mantenimiento">
        {% include 'mantenimiento/_lista.html' %}
    </div>
</div>
{% endblock %}
