{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-file-invoice-dollar"></i> Facturación</h1>
    <div>
        <a href="{% url 'morosos' %}" class="btn btn-danger"><i class="fas fa-exclamation-triangle"></i> Morosos</a>
        <a href="{% url 'exportar_facturas_excel' %}" class="btn btn-success"><i class="fas fa-file-excel"></i> Exportar Excel</a>
        <a href="{% url 'factura_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Factura</a>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" 
               class="form-control" 
               name="q" 
               placeholder="Buscar por nº factura, propietario, estado..." 
               value="{{ query }}"
               hx-get="{% url 'factura_list' %}" 
               hx-trigger="keyup changed delay:300ms" 
               hx-target="#lista-facturas"
               hx-push-url="true">
    </div>
</div>

<div class="d-flex justify-content-end mb-2">
  <form method="get" class="d-flex align-items-center gap-2">
    <input type="hidden" name="q" value="{{ query }}">
    <label class="small text-muted">Por página:</label>
    <select name="per_page" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
      <option value="5" {% if not request.GET.per_page or request.GET.per_page == '5' %}selected{% endif %}>5</option>
      <option value="10" {% if request.GET.per_page == '10' %}selected{% endif %}>10</option>
      <option value="25" {% if request.GET.per_page == '25' %}selected{% endif %}>25</option>
      <option value="50" {% if request.GET.per_page == '50' %}selected{% endif %}>50</option>
    </select>
  </form>
</div>
<div class="card">
    <div class="card-body" id="lista-facturas">
        {% include 'facturacion/_lista.html' %}
    </div>
</div>
{% endblock %}
