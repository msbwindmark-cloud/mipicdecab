{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-tasks"></i> Tareas / Pendientes</h1>
    <a href="{% url 'tarea_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Tarea</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por título, prioridad, estado..." value="{{ query }}"
               hx-get="{% url 'tarea_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-tareas" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-tareas">
        {% include 'tareas/_lista.html' %}
    </div>
</div>
{% endblock %}
