{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-money-bill-wave"></i> Gastos por Caballo</h1>
    <a href="{% url 'gasto_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Gasto</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <h5 class="text-center mb-3">Total Gastos: <span class="text-danger fw-bold">{{ total }} €</span></h5>
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, concepto, categoría, proveedor..." value="{{ query }}"
               hx-get="{% url 'gasto_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-gastos-caballo" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-gastos-caballo">
        {% include 'gastos_caballo/_lista.html' %}
    </div>
</div>
{% endblock %}
