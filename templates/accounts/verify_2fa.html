{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark text-center">
                <h3 class="mb-0"><i class="fas fa-shield-alt"></i> Verificación en Dos Pasos</h3>
            </div>
            <div class="card-body p-4 text-center">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                
                <p class="mb-3">Hemos enviado un código de 6 dígitos a<br><strong>{{ user.email }}</strong></p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.code }}
                    </div>
                    <button type="submit" class="btn btn-warning w-100">
                        <i class="fas fa-check"></i> Verificar Código
                    </button>
                </form>
                
                <div class="mt-3">
                    <a href="{% url 'login' %}" class="text-muted">Volver al login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
