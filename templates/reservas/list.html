{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-calendar-check"></i> Reservas de Pistas</h1>
    <a href="{% url 'reserva_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Reserva</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por pista, propietario, motivo, estado..." value="{{ query }}"
               hx-get="{% url 'reserva_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-reservas" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-reservas">
        {% include 'reservas/_lista.html' %}
    </div>
</div>
{% endblock %}
