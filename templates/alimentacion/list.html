{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-utensils"></i> Plan de Alimentación</h1>
</div>

<div class="card mb-4">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Registrar Alimentación de Hoy ({{ hoy }})</h5>
    </div>
    <div class="card-body">
        <form method="post" action="{% url 'registrar_alimentacion' %}" class="row g-3">
            {% csrf_token %}
            <div class="col-md-3">
                <label class="form-label">Caballo</label>
                <select name="caballo" class="form-select" required>
                    {% for c in caballos %}
                    <option value="{{ c.pk }}">{{ c.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Momento</label>
                <select name="momento" class="form-select">
                    <option value="MANANA">Mañana</option>
                    <option value="MEDIODIA">Mediodía</option>
                    <option value="TARDE">Tarde</option>
                    <option value="NOCHE">Noche</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <div class="form-check">
                    <input type="checkbox" name="dado" class="form-check-input" id="dado" checked>
                    <label class="form-check-label" for="dado">Dado</label>
                </div>
            </div>
            <div class="col-md-3">
                <label class="form-label">Notas</label>
                <input type="text" name="notas" class="form-control">
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-success w-100"><i class="fas fa-save"></i> Registrar</button>
            </div>
        </form>
    </div>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, momento, notas..." value="{{ query }}"
               hx-get="{% url 'alimentacion_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-alimentacion" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-header bg-dark text-white">
        <h5 class="mb-0">Registros de Alimentación</h5>
    </div>
    <div class="d-flex justify-content-end mb-2">
  <form method="get" class="d-flex align-items-center gap-2">
    <input type="hidden" name="q" value="{{ query }}">
    <label class="small text-muted">Por página:</label>
    <select name="per_page" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
      <option value="5" {% if not request.GET.per_page or request.GET.per_page == '5' %}selected{% endif %}>5</option>
      <option value="10" {% if request.GET.per_page == '10' %}selected{% endif %}>10</option>
      <option value="25" {% if request.GET.per_page == '25' %}selected{% endif %}>25</option>
      <option value="50" {% if request.GET.per_page == '50' %}selected{% endif %}>50</option>
    </select>
  </form>
</div>
<div class="card-body" id="lista-alimentacion">
        {% include 'alimentacion/_lista.html' %}
    </div>
</div>
{% endblock %}
