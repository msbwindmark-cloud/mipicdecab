{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-trophy"></i> Eventos y Competiciones</h1>
    <a href="{% url 'evento_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Evento</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por nombre, tipo, lugar..." value="{{ query }}"
               hx-get="{% url 'evento_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-eventos" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-eventos">
        {% include 'eventos/_lista.html' %}
    </div>
</div>
{% endblock %}
