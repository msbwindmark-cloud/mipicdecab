{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-truck-moving"></i> Transporte de Caballos</h1>
    <a href="{% url 'transporte_programar' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Programar Transporte</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, origen, destino, transportista..." value="{{ query }}"
               hx-get="{% url 'transporte_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-transporte" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-transporte">
        {% include 'transporte/_lista.html' %}
    </div>
</div>
{% endblock %}
