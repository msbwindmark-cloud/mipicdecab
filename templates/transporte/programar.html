{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h3 class="mb-0"><i class="fas fa-truck-moving"></i> Programar Transporte</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Caballo</label>
                            <select name="caballo" class="form-select" required>
                                {% for c in caballos %}
                                <option value="{{ c.pk }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Propietario (opcional)</label>
                            <select name="propietario" class="form-select">
                                <option value="">Ninguno</option>
                                {% for p in propietarios %}
                                <option value="{{ p.pk }}">{{ p }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select">
                                <option value="COMPETICION">Competición</option>
                                <option value="VETERINARIO">Veterinario</option>
                                <option value="VENTA">Venta/Compra</option>
                                <option value="TRASLADO">Traslado</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha/Hora Salida</label>
                            <input type="datetime-local" name="fecha_salida" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Coste (€)</label>
                            <input type="number" name="coste" class="form-control" step="0.01" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Origen</label>
                            <input type="text" name="origen" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Destino</label>
                            <input type="text" name="destino" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Transportista</label>
                            <input type="text" name="transportista" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Vehículo</label>
                            <input type="text" name="vehiculo" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Programar Transporte</button>
                        <a href="{% url 'transporte_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
