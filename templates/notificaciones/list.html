{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-bell"></i> Notificaciones</h1>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por título, mensaje, tipo..." value="{{ query }}"
               hx-get="{% url 'notificacion_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-notificaciones" hx-push-url="true">
    </div>
</div>

<div class="d-flex justify-content-end mb-2">
  <form method="get" class="d-flex align-items-center gap-2">
    <input type="hidden" name="q" value="{{ query }}">
    <label class="small text-muted">Por página:</label>
    <select name="per_page" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
      <option value="5" {% if not request.GET.per_page or request.GET.per_page == '5' %}selected{% endif %}>5</option>
      <option value="10" {% if request.GET.per_page == '10' %}selected{% endif %}>10</option>
      <option value="25" {% if request.GET.per_page == '25' %}selected{% endif %}>25</option>
      <option value="50" {% if request.GET.per_page == '50' %}selected{% endif %}>50</option>
    </select>
  </form>
</div>
<div class="card">
    <div class="card-body" id="lista-notificaciones">
        {% include 'notificaciones/_lista.html' %}
    </div>
</div>
{% endblock %}
