{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-poll"></i> Encuestas de Satisfacción</h1>
    <a href="{% url 'encuesta_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Encuesta</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por titulo, tipo, descripcion..." value="{{ query }}"
               hx-get="{% url 'encuesta_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-encuestas" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-encuestas">
        {% include 'encuestas/_lista.html' %}
    </div>
</div>
{% endblock %}
