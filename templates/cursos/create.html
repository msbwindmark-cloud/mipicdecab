{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h3 class="mb-0"><i class="fas fa-graduation-cap"></i> Nuevo Curso</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Instructor</label>
                            <input type="text" name="instructor" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nivel</label>
                            <select name="nivel" class="form-select">
                                <option value="INICIACION">Iniciación</option>
                                <option value="PRINCIPIANTE">Principiante</option>
                                <option value="INTERMEDIO">Intermedio</option>
                                <option value="AVANZADO">Avanzado</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha Inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha Fin</label>
                            <input type="date" name="fecha_fin" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Plazas</label>
                            <input type="number" name="plazas" class="form-control" value="10">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio (€)</label>
                            <input type="number" name="precio" class="form-control" step="0.01" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Crear Curso</button>
                        <a href="{% url 'curso_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
