{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-book"></i> Bitácora del Picadero</h1>
    <a href="{% url 'bitacora_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nueva Nota</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por título, tipo, caballo..." value="{{ query }}"
               hx-get="{% url 'bitacora_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-bitacora" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-bitacora">
        {% include 'bitacora/_lista.html' %}
    </div>
</div>
{% endblock %}
