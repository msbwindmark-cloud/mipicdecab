{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-dark text-white">
                <h3 class="mb-0"><i class="fas fa-book"></i> Nueva Nota en Bitácora</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tipo</label>
                            <select name="tipo" class="form-select">
                                <option value="GENERAL">General</option>
                                <option value="VETERINARIO">Veterinario</option>
                                <option value="HERRAJE">Herraje</option>
                                <option value="ALIMENTACION">Alimentación</option>
                                <option value="INCIDENCIA">Incidencia</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Caballo (opcional)</label>
                            <select name="caballo" class="form-select">
                                <option value="">General</option>
                                {% for c in caballos %}
                                <option value="{{ c.pk }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" name="importante" class="form-check-input" id="importante">
                                <label class="form-check-label" for="importante">Importante</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label class="form-label">Contenido</label>
                        <textarea name="contenido" class="form-control" rows="5" required></textarea>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Guardar Nota</button>
                        <a href="{% url 'bitacora_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
