{% extends 'base.html' %}
{% block content %}
<h1><i class="fas fa-user"></i> Portal del Propietario</h1>
<h3 class="mt-4">Mis Caballos</h3>
<div class="row g-4">
    {% for c in caballos %}
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5>{{ c.nombre }}</h5>
                <a href="{% url 'portal_caballo_propietario' c.pk %}" class="btn btn-primary">Ver detalles</a>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-muted">Sin caballos asignados</p>
    {% endfor %}
</div>
{% endblock %}
