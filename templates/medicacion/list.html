{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-pills"></i> Medicación y Tratamientos</h1>
    <a href="{% url 'tratamiento_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Tratamiento</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, medicamento, motivo..." value="{{ query }}"
               hx-get="{% url 'medicacion_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-medicacion" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-medicacion">
        {% include 'medicacion/_lista.html' %}
    </div>
</div>
{% endblock %}
