{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0"><i class="fas fa-tag"></i> Publicar Caballo en Venta</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Caballo</label>
                            <select name="caballo" class="form-select" required>
                                {% for c in caballos %}
                                <option value="{{ c.pk }}">{{ c.nombre }} ({{ c.raza }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Precio Venta (€)</label>
                            <input type="number" name="precio_venta" class="form-control" step="0.01" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Precio Mínimo (€)</label>
                            <input type="number" name="precio_minimo" class="form-control" step="0.01">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="2"></textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Publicar</button>
                        <a href="{% url 'venta_list' %}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
