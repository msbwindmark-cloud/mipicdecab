{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-tag"></i> Venta de Caballos</h1>
    <a href="{% url 'venta_publicar' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Publicar Caballo</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, estado, descripción..." value="{{ query }}"
               hx-get="{% url 'venta_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-ventas" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-ventas">
        {% include 'ventas/_lista.html' %}
    </div>
</div>
{% endblock %}
