{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-running"></i> Entrenamientos</h1>
    <a href="{% url 'entrenamiento_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Nuevo Entrenamiento</a>
</div>

<div class="card mb-3">
    <div class="card-body">
        <input type="text" class="form-control" name="q" placeholder="Buscar por caballo, objetivo, ejercicios..." value="{{ query }}"
               hx-get="{% url 'entrenamiento_list' %}" hx-trigger="keyup changed delay:300ms" hx-target="#lista-entrenamiento" hx-push-url="true">
    </div>
</div>

<div class="card">
    <div class="card-body" id="lista-entrenamiento">
        {% include 'entrenamientos/_lista.html' %}
    </div>
</div>
{% endblock %}
